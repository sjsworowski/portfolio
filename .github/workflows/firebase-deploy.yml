name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    tags:
      - '*-prod'

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: portfolio-302eb
          target: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}